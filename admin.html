<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Be Grow Portfolio — Private Admin</title><meta name="robots" content="noindex,nofollow,noarchive"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{min-height:100vh;padding:22px;background:radial-gradient(circle at 20% 10%,rgba(37,112,255,.22),transparent 30%),radial-gradient(circle at 85% 35%,rgba(72,160,255,.12),transparent 32%),linear-gradient(145deg,#020817,#061329 52%,#030914);color:#f4f8ff}.card{width:min(980px,100%);margin:0 auto;padding:34px 28px;border-radius:24px;background:rgba(5,16,35,.78);border:1px solid rgba(108,170,255,.28);box-shadow:0 24px 80px rgba(0,0,0,.5),0 0 50px rgba(37,112,255,.08);backdrop-filter:blur(18px)}.login{max-width:700px;margin:10vh auto;text-align:center}.eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#9bc9ff;opacity:.82}h1{margin:10px 0 8px;font-size:clamp(30px,7vw,46px);background:linear-gradient(100deg,#fff 10%,#9bc9ff 48%,#fff 78%);-webkit-background-clip:text;background-clip:text;color:transparent}.domain{opacity:.72;margin-bottom:26px}.input{width:100%;padding:15px 16px;border-radius:14px;border:1px solid rgba(155,201,255,.22);background:rgba(255,255,255,.055);color:#fff;outline:none;font-size:16px}button{border:1px solid rgba(108,170,255,.4);background:linear-gradient(135deg,rgba(37,112,255,.28),rgba(72,160,255,.12));color:#fff;padding:12px 22px;border-radius:999px;cursor:pointer;font-weight:750}#login button{margin-top:14px;width:100%}.error{min-height:18px;margin-top:10px;color:#ff9eaa;font-size:12px}#dashboard{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0 6px}.stat{padding:20px 12px;border:1px solid rgba(108,170,255,.18);border-radius:18px;background:rgba(7,22,40,.48);box-shadow:0 10px 40px rgba(0,0,0,.18)}.count{font-size:clamp(42px,9vw,68px);font-weight:850;line-height:1;letter-spacing:-.05em;margin:0 0 9px;background:linear-gradient(100deg,#fff,#9bc9ff,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}.human .count{background:linear-gradient(100deg,#fff,#8ff0c3,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}.bot .count{background:linear-gradient(100deg,#fff,#ffb77a,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}.label{font-size:12px;opacity:.66;line-height:1.35}.status{margin-top:18px;font-size:12px;opacity:.52}.note{margin-top:10px;font-size:11px;line-height:1.5;opacity:.42}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}.reset{border-color:rgba(255,190,80,.38);background:linear-gradient(135deg,rgba(255,177,65,.16),rgba(255,255,255,.06))}.logout{border-color:rgba(155,201,255,.25)}.panel{margin-top:24px;border:1px solid rgba(108,170,255,.18);border-radius:18px;background:rgba(7,22,40,.48);overflow:hidden}.panel-head{padding:17px 18px;border-bottom:1px solid rgba(108,170,255,.13);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.panel-title{font-weight:800}.visitor-list{max-height:520px;overflow:auto}.visitor{display:grid;grid-template-columns:150px 1fr 190px;gap:14px;align-items:center;padding:15px 18px;border-bottom:1px solid rgba(108,170,255,.09)}.visitor:last-child{border-bottom:0}.type{font-weight:800;font-size:13px}.type.h{color:#8ff0c3}.type.b{color:#ffb77a}.loc{font-size:14px}.time{font-size:11px;opacity:.55;text-align:right}.empty{padding:35px;text-align:center;opacity:.5;font-size:13px}@media(max-width:700px){.stats{grid-template-columns:1fr}.visitor{grid-template-columns:1fr;gap:5px}.time{text-align:left}.card{padding:28px 16px}} </style></head><body><main class="card"><section id="login" class="login"><div class="eyebrow">Private Admin</div><h1>Visitor Analytics</h1><div class="domain">Be Grow Portfolio</div><input id="password" class="input" type="password" placeholder="Enter admin password" autocomplete="current-password"><button onclick="login()">Login</button><div id="error" class="error"></div></section><section id="dashboard"><div class="top"><div><div class="eyebrow">Private Admin</div><h1>Visitor Analytics</h1><div class="domain">Be Grow Portfolio</div></div></div><div class="stats"><div class="stat"><div id="total" class="count">—</div><div class="label">Total Visitors</div></div><div class="stat human"><div id="human" class="count">—</div><div class="label">Human Visitors</div></div><div class="stat bot"><div id="bot" class="count">—</div><div class="label">Bot Visitors</div></div></div><div id="status" class="status">Loading…</div><div class="actions"><button onclick="loadData()">Refresh</button><button class="reset" onclick="resetView()">Reset Visitors</button><button class="logout" onclick="logout()">Logout</button></div><section class="panel"><div class="panel-head"><div class="panel-title">Recent Visitors</div><div class="label">Approximate location</div></div><div id="visitorList" class="visitor-list"><div class="empty">Loading visitors…</div></div></section></section></main><script>
const SUPABASE_URL='https://kqgqcyqegwgfyqgkmbmv.supabase.co'; const SUPABASE_KEY='sb_publishable_YfoA8u5yulgkxqORnn75NQ_xLmB_rEQ'; const SITE='portfolio'; const AUTH_KEY='private_admin_'+SITE.replace(/\W/g,'_'); const RESET_KEY='visitor_reset_'+SITE;  const PASS_HASH='f0ce0e86206541c60bc47be815f83eba98004f63c883e6d71ff5cc929cb5f9ca'; async function sha256(s){const b=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');} async function login(){const p=document.getElementById('password').value;if(await sha256(p)!==PASS_HASH){document.getElementById('error').textContent='Incorrect password.';return}sessionStorage.setItem(AUTH_KEY,'1');showDashboard();}
function showDashboard(){document.getElementById('login').style.display='none';document.getElementById('dashboard').style.display='block';loadData();}function logout(){sessionStorage.removeItem(AUTH_KEY);location.reload();}
function headers(){return {'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY};}
function resetAt(){return localStorage.getItem(RESET_KEY)||'1970-01-01T00:00:00.000Z';}
async function fetchRows(){const url=SUPABASE_URL+'/rest/v1/visitor_logs?site=eq.'+encodeURIComponent(SITE)+'&select=visitor_type,city,country,country_code,visited_at&visited_at=gt.'+encodeURIComponent(resetAt())+'&order=visited_at.desc&limit=1000';const r=await fetch(url,{headers:headers(),cache:'no-store'});if(!r.ok)throw new Error(await r.text());return r.json();}
function render(rows){const human=rows.filter(x=>x.visitor_type==='human').length,bot=rows.filter(x=>x.visitor_type==='bot').length;document.getElementById('total').textContent=rows.length.toLocaleString();document.getElementById('human').textContent=human.toLocaleString();document.getElementById('bot').textContent=bot.toLocaleString();const el=document.getElementById('visitorList');if(!rows.length){el.innerHTML='<div class="empty">No visitors recorded yet.</div>';return}el.innerHTML=rows.map(v=>`<div class="visitor"><div class="type ${v.visitor_type==='human'?'h':'b'}">${v.visitor_type==='human'?'👤 Human Visitor':'🤖 Bot Visitor'}</div><div class="loc">${escapeHtml(v.city||'Unknown')}, ${escapeHtml(v.country||'Unknown')}</div><div class="time">${new Date(v.visited_at).toLocaleString()}</div></div>`).join('');}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function loadData(){document.getElementById('status').textContent='Loading…';try{const rows=await fetchRows();render(rows);document.getElementById('status').textContent='Updated just now';}catch(e){document.getElementById('status').textContent='Unable to load visitor data. Run the supplied Supabase SQL setup first.';}}
function resetView(){if(!confirm('Reset the displayed visitor totals and recent list from now? Existing database records will be kept.'))return;localStorage.setItem(RESET_KEY,new Date().toISOString());render([]);document.getElementById('status').textContent='View reset on this admin browser';}
if(sessionStorage.getItem(AUTH_KEY)==='1')showDashboard();
</script></body></html>
